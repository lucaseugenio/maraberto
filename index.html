/* ==== Mar Aberto · tema pastel oceano ==== */
:root{
  --bg:#F3F7F8; --bg2:#F8F6F1;
  --surface:#FFFFFF; --surface-2:#FBFDFD;
  --ink:#2E4A57; --ink-soft:#64818F; --ink-faint:#93A8B2;
  --line:#E2ECef; --line-soft:#EDF3F4;
  --teal:#5C93A6; --teal-deep:#3F7585; --teal-soft:#DCECF1; --teal-softer:#EFF6F8;
  --coral:#E09A85; --coral-deep:#C97A62; --coral-soft:#F9E5DE;
  --green:#85C3AB; --green-deep:#5F9F87; --green-soft:#DDF0E8;
  --amber:#E4BC7E; --amber-deep:#C39A54; --amber-soft:#F7ECD9;
  --lilac:#A9A3D8; --lilac-soft:#E9E7F6;
  --rose:#DB9BB4; --rose-soft:#F7E3EC;
  --shadow:0 10px 30px -18px rgba(46,74,87,.25), 0 2px 6px -2px rgba(46,74,87,.08);
  --shadow-lg:0 24px 60px -24px rgba(46,74,87,.35);
  --r:16px; --r-sm:11px;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--ink);font-size:15.5px;line-height:1.5;
  background:
    radial-gradient(1100px 480px at 85% -140px, rgba(133,195,171,.16), transparent 60%),
    radial-gradient(900px 420px at -10% -120px, rgba(92,147,166,.14), transparent 55%),
    linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
  background-attachment:fixed;min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--teal-deep)}
::selection{background:var(--teal-soft)}
h1,h2,h3{font-weight:800;letter-spacing:-.2px}

/* ==== shell ==== */
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(243,247,248,.82);border-bottom:1px solid var(--line);}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(92,147,166,.35))}
.brand .mark img,.brand .mark svg{width:100%;height:100%;border-radius:14px;display:block}
.brand-name{font-weight:900;font-size:1.22rem;line-height:1.05;color:var(--ink)}
.topbar .spacer{flex:1}
.db-pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:.8rem;font-weight:800;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);box-shadow:var(--shadow)}
.db-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.db-pill.on .dot{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.projtabs{display:flex;gap:8px;align-items:center;max-width:1180px;margin:0 auto;padding:0 20px}
.ptab{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:14px 14px 0 0;font-weight:800;color:var(--ink-soft);
  border:1px solid transparent;border-bottom:none;font-size:.95rem}
.ptab.active{background:var(--surface);color:var(--teal-deep);border-color:var(--line);position:relative;top:1px}
.ptab .t-emoji{font-size:1rem}
.ptab.ghost{color:var(--ink-faint);border:1px dashed var(--line);border-bottom:none;border-radius:14px 14px 0 0;padding:9px 12px;cursor:default}
.main{max-width:1180px;margin:0 auto;padding:20px 20px 90px}
.secnnav{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 14px;scrollbar-width:thin}
.secnnav::-webkit-scrollbar{height:6px}
.secnnav::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.snav{white-space:nowrap;display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;font-weight:800;font-size:.88rem;
  color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 3px rgba(46,74,87,.05);transition:all .15s}
.snav:hover{color:var(--teal-deep);border-color:var(--teal-soft)}
.snav.active{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 16px -8px rgba(92,147,166,.7)}
.snav .badge{background:rgba(255,255,255,.28);border-radius:999px;padding:0 7px;font-size:.75rem;font-weight:900}
.snav:not(.active) .badge{background:var(--teal-soft);color:var(--teal-deep)}
.sechead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:10px 0 16px}
.sechead h1{font-size:1.5rem}
.sechead .desc{color:var(--ink-soft);font-size:.9rem;max-width:560px}
.sechead .actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ==== botões ==== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;font-weight:800;font-size:.88rem;
  transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--teal);color:#fff;box-shadow:0 8px 18px -10px rgba(92,147,166,.8)}
.btn-primary:hover{background:var(--teal-deep)}
.btn-soft{background:var(--teal-softer);color:var(--teal-deep);border-color:var(--line)}
.btn-soft:hover{background:var(--teal-soft)}
.btn-ghost{color:var(--ink-soft);border-color:var(--line);background:var(--surface)}
.btn-ghost:hover{color:var(--teal-deep);border-color:var(--teal-soft)}
.btn-danger{background:var(--coral-soft);color:var(--coral-deep)}
.btn-danger:hover{background:#F5D8CE}
.btn-sm{padding:6px 11px;font-size:.8rem;border-radius:10px}
.iconbtn{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:all .15s}
.iconbtn:hover{background:var(--teal-soft);color:var(--teal-deep)}
.iconbtn.del:hover{background:var(--coral-soft);color:var(--coral-deep)}
.iconbtn svg{width:14.5px;height:14.5px}

/* ==== cards / grid ==== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.card-h h3{font-size:1rem}
.card-h .hint{font-size:.78rem;color:var(--ink-faint);font-weight:600}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.kpi{border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.kpi .lbl{font-size:.78rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;display:flex;gap:7px;align-items:center}
.kpi .val{font-size:1.62rem;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.kpi .sub{font-size:.8rem;color:var(--ink-soft);margin-top:3px;font-weight:600}
.kpi .wash{position:absolute;right:-28px;top:-28px;width:110px;height:110px;border-radius:50%;opacity:.5}
.kpi.t-teal .wash{background:var(--teal-soft)} .kpi.t-coral .wash{background:var(--coral-soft)}
.kpi.t-green .wash{background:var(--green-soft)} .kpi.t-amber .wash{background:var(--amber-soft)}
.kpi.t-lilac .wash{background:var(--lilac-soft)}
.kpi.t-teal .val{color:var(--teal-deep)} .kpi.t-coral .val{color:var(--coral-deep)}
.kpi.t-green .val{color:var(--green-deep)} .kpi.t-amber .val{color:var(--amber-deep)}
.kpi.t-lilac .val{color:var(--lilac)}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.cols>.card{min-width:0}

/* ==== chips / badges ==== */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:800}
.chip .em{font-size:.9rem;line-height:1}
.pill-soft{border-radius:999px;padding:3px 11px;font-size:.76rem;font-weight:800}
.st-pago{background:var(--green-soft);color:var(--green-deep)}
.st-carga{background:var(--green-soft);color:var(--green-deep)}
.st-agend{background:var(--amber-soft);color:var(--amber-deep)}
.diasbadge{border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:900}
.dias-ok{background:var(--green-soft);color:var(--green-deep)}
.dias-alert{background:var(--amber-soft);color:var(--amber-deep)}
.dias-urge{background:var(--coral-soft);color:var(--coral-deep)}
.dias-pass{background:var(--line-soft);color:var(--ink-faint)}
.tit-chip{background:var(--lilac-soft);color:#6F69A5}
.vpos{color:var(--green-deep);font-weight:900}
.vneg{color:var(--coral-deep);font-weight:900}
.muted{color:var(--ink-faint);font-size:.82rem;font-weight:600}

/* ==== contas ==== */
.contas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:15px}
.conta-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.conta-card .top{display:flex;align-items:center;gap:11px}
.conta-card h3{font-size:1.03rem}
.conta-card .banco-n{font-size:.78rem;color:var(--ink-soft);font-weight:700}
.conta-card .saldo{font-size:1.42rem;font-weight:900;margin:11px 0 3px;letter-spacing:-.5px}
.conta-card .meta-lbl{font-size:.75rem;color:var(--ink-soft);font-weight:700;display:flex;justify-content:space-between;margin-top:12px}
.bar{height:9px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:6px}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .4s}
.bar .meta-ok{background:linear-gradient(90deg,var(--green),#A9DCC5)}
.conta-card .foot{display:flex;align-items:center;gap:6px;margin-top:13px;padding-top:11px;border-top:1px dashed var(--line)}
.bankbadge{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.82rem;flex:0 0 auto;letter-spacing:-.3px}

/* ==== cartões (visual cartão) ==== */
.cartoes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:17px}
.ccard-wrap{display:flex;flex-direction:column;gap:11px}
.ccard{border-radius:20px;padding:17px 18px;position:relative;color:#fff;min-height:158px;display:flex;flex-direction:column;
  box-shadow:0 16px 34px -18px rgba(46,74,87,.5);overflow:hidden}
.ccard .glow{position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.14);right:-52px;top:-62px}
.ccard .glow2{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10);left:-36px;bottom:-52px}
.ccard .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ccard .nome{font-weight:900;font-size:1.06rem;text-shadow:0 1px 3px rgba(0,0,0,.13)}
.ccard .chipem{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#F3E5C2,#D9BE87);border:1px solid rgba(0,0,0,.09)}
.ccard .row2{display:flex;gap:16px;margin-top:auto;font-size:.76rem;font-weight:700;opacity:.94}
.ccard .row2 b{display:block;font-size:.86rem;font-weight:900}
.ccard .bandeira{opacity:.96}
.ccard-info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;box-shadow:var(--shadow)}
.ccard-info .li{display:flex;justify-content:space-between;gap:9px;padding:5px 0;font-size:.86rem;align-items:center}
.ccard-info .li b{font-weight:900}
.ccard-info .li+.li{border-top:1px dashed var(--line-soft)}

/* ==== lançamentos (lista) ==== */
.lan-list{display:flex;flex-direction:column;gap:7px}
.lan-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 14px;box-shadow:0 1px 3px rgba(46,74,87,.04);flex-wrap:wrap}
.lan-row.fut{border-style:dashed;background:var(--surface-2)}
.lan-row .data{font-size:.76rem;font-weight:800;color:var(--ink-soft);width:60px;flex:0 0 auto;text-align:center;line-height:1.25}
.lan-row .data small{display:block;font-weight:700;color:var(--ink-faint)}
.lan-row .desc{flex:1;min-width:150px}
.lan-row .desc b{font-weight:800}
.lan-row .desc .meta-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:3px}
.lan-row .valor{font-weight:900;font-size:.98rem;white-space:nowrap}
.lan-row .ops{display:flex;gap:2px}
.cat-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:800}
.src-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:8px;font-size:.73rem;font-weight:800;background:var(--teal-softer);color:var(--teal-deep);border:1px solid var(--line)}
.src-chip.card-src{background:var(--amber-soft);color:var(--amber-deep);border-color:transparent}
.filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.filtro{display:flex;flex-direction:column;gap:4px}
.filtro label{font-size:.72rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}

/* ==== tabela ==== */
.tbl{width:100%;border-collapse:collapse;font-size:.87rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:hover td{background:var(--teal-softer)}
.tbl .num{text-align:right;font-weight:800;white-space:nowrap}

/* ==== formulários ==== */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:.78rem;font-weight:800;color:var(--ink-soft)}
.field .opt{color:var(--ink-faint);font-weight:600;text-transform:none;letter-spacing:0}
.input,select.input,textarea.input{border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--surface);outline:none;transition:border .15s, box-shadow .15s;width:100%}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
textarea.input{resize:vertical;min-height:60px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.seg{display:flex;gap:5px;background:var(--teal-softer);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-weight:800;font-size:.85rem;color:var(--ink-soft);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--teal-deep);box-shadow:0 2px 6px -2px rgba(46,74,87,.2)}
.seg button.on.t-despesa{color:var(--coral-deep)} .seg button.on.t-receita{color:var(--green-deep)}
.seg button.on.t-pagamento{color:var(--teal-deep)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px;max-height:150px;overflow:auto;padding:4px;border:1.5px solid var(--line);border-radius:11px}
.emoji-grid button{font-size:1.25rem;padding:6px 0;border-radius:9px}
.emoji-grid button:hover{background:var(--teal-soft)}
.emoji-grid button.on{background:var(--teal-soft);outline:2px solid var(--teal)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;transition:all .15s}
.swatches button.on{outline:2.5px solid var(--ink);outline-offset:2px}
.chips-members{display:flex;gap:7px;flex-wrap:wrap}
.chips-members button{padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:.85rem;background:var(--surface);color:var(--ink-soft)}
.chips-members button.on{background:var(--lilac-soft);border-color:var(--lilac);color:#6F69A5}

/* ==== modal ==== */
.modal-back{position:fixed;inset:0;background:rgba(46,74,87,.42);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;animation:fade .18s}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:620px;padding:22px 24px;animation:pop .2s;margin-bottom:6vh}
.modal.wide{max-width:780px}
.modal-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.modal-h h2{font-size:1.2rem}
.modal-h .iconbtn{margin-left:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(9px) scale(.98)}}

/* ==== toast ==== */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;font-size:.88rem;box-shadow:var(--shadow-lg);animation:pop .2s;max-width:92vw;text-align:center}
.toast.ok{background:var(--green-deep)} .toast.err{background:var(--coral-deep)} .toast.warn{background:var(--amber-deep)}

/* ==== gráficos svg ==== */
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.legend .lg i{width:11px;height:11px;border-radius:4px;display:inline-block}

/* ==== categorias ==== */
.cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.cat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow);position:relative}
.cat-card .em{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:0 0 auto}
.cat-card b{display:block;font-size:.92rem}
.cat-card small{color:var(--ink-soft);font-size:.73rem;font-weight:700}
.cat-card .ops{margin-left:auto;display:flex;gap:2px}

/* ==== estados vazios / misc ==== */
.empty{text-align:center;padding:36px 16px;color:var(--ink-soft)}
.empty .em{font-size:2.4rem;display:block;margin-bottom:8px}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:.98rem}
.note{background:var(--amber-soft);border:1px solid #EFDDBC;border-radius:12px;padding:11px 14px;font-size:.84rem;color:#7A6132;font-weight:600}
.note.tealnote{background:var(--teal-softer);border-color:#C9E0E8;color:var(--teal-deep)}
.bigdate{font-size:1.05rem;font-weight:800;color:var(--teal-deep)}
.proj-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.timeline{position:relative;margin-left:8px;padding-left:20px;border-left:2px solid var(--teal-soft)}
.timeline .tl-item{position:relative;padding:7px 0 7px 6px}
.timeline .tl-item::before{content:"";position:absolute;left:-27px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2.5px solid var(--surface);box-shadow:0 0 0 2px var(--teal-soft)}
.timeline .tl-item.despesa::before{background:var(--coral)} .timeline .tl-item.receita::before{background:var(--green)}
.timeline .tl-item.carga::before{background:var(--green)}
.timeline .tl-item.fatura::before{background:var(--amber)}
.sql-box{background:#2E4A57;color:#DCECF1;border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;white-space:pre;overflow:auto;max-height:220px;line-height:1.5}
input[type=date].input,input[type=number].input{padding-block:8px}
.hr{border:none;border-top:1px dashed var(--line);margin:16px 0}
.switchline{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.9rem;color:var(--ink-soft)}
.switchline input{width:17px;height:17px;accent-color:var(--teal)}

/* ==== responsivo ==== */
@media(max-width:900px){ .cols{grid-template-columns:1fr} }
@media(max-width:640px){
  .main{padding:14px 12px 70px}
  .topbar-in{padding:9px 12px}
  .frow,.frow3{grid-template-columns:1fr}
  .brand-name{font-size:1.05rem}
  .kpi .val{font-size:1.35rem}
  .lan-row .data{width:52px}
  .sechead .actions{margin-left:0;width:100%}
}
</style>
</head>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>Math.round((+v||0)*100)/100;
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v||0);
const num=v=>{if(v==null||v==='')return 0;let s=String(v).trim().replace(/[R$\s]/g,'');
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  const n=Number(s);return isNaN(n)?0:n;};
function parseISO(s){const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);}
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayISO=()=>toISO(new Date());
function fmtData(s){if(!s)return'—';const d=parseISO(s);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}
function fmtDataCurta(s){if(!s)return'—';const d=parseISO(s);return d.getDate()+'/'+(d.getMonth()+1);}
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function fmtMes(k){const[y,m]=k.split('-');return MESES[+m-1]+'/'+y.slice(2);}
function daysUntil(s){const d=parseISO(s),t=parseISO(todayISO());return Math.round((d-t)/864e5);}
function addMonthsISO(s,n){const d=parseISO(s);const day=d.getDate();const target=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();target.setDate(Math.min(day,last));return toISO(target);}
function addDaysISO(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return toISO(d);}
function monthEndISO(s){const d=parseISO(s);return toISO(new Date(d.getFullYear(),d.getMonth()+1,0));}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};

/* SUPABASE_PRESET é injetado no build (src/supabase_config.json) quando o usuário
   manda a URL e a anon key — assim o arquivo já abre conectado. O que o usuário
   salvar aqui sobrepõe o preset; escolher "usar só modo local" desliga tudo. */
const SB={
  cfg(){let saved=null;try{saved=JSON.parse(localStorage.getItem('marAberto_sb')||'null');}catch(e){}
    if(saved&&saved.off)return null;
    if(saved&&saved.url&&saved.key)return saved;
    if(typeof SUPABASE_PRESET!=='undefined'&&SUPABASE_PRESET&&SUPABASE_PRESET.url&&SUPABASE_PRESET.key)return SUPABASE_PRESET;
    return null;},
  set(c){if(c&&c.url&&c.key)localStorage.setItem('marAberto_sb',JSON.stringify({url:c.url.trim().replace(/\/+$/,''),key:c.key.trim()}));
    else localStorage.setItem('marAberto_sb',JSON.stringify({off:true}));},
  async req(c,method,path,body,prefer){
    const r=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/'+path,{method,
      headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(prefer?{Prefer:prefer}:{})},
      body:body!==undefined?JSON.stringify(body):undefined});
    if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('Supabase '+r.status+(t?' · '+t.slice(0,140):''));}
    return r.status===204?null:await r.json();
  },
  list(c,t){return this.req(c,'GET',t+'?select=*&order=id');},
  insert(c,t,row){return this.req(c,'POST',t,[row],'return=representation').then(a=>a&&a[0]);},
  update(c,t,id,patch){return this.req(c,'PATCH',t+'?id=eq.'+id,patch,'return=representation').then(a=>a&&a[0]);},
  remove(c,t,id){return this.req(c,'DELETE',t+'?id=eq.'+id);},
  upsert(c,t,rows){return this.req(c,'POST',t+'?on_conflict=id',rows,'resolution=merge-duplicates');},
  async ping(c){const r=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/contas?select=id&limit=1',{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});if(!r.ok)throw new Error('HTTP '+r.status);return true;}
};
const TABLES=['contas','cartoes','categorias','lancamentos','racoes'];
function cleanRow(o){const{...rest}=o;delete rest._local;return rest;}
async function syncRemoto(fn,okMsg){const c=SB.cfg();if(!c)return;try{await fn(c);}catch(e){console.warn(e);toast('⚠️ Salvo localmente, mas falhou no Supabase: '+e.message,'warn',4200);}}
async function pullRemoto(){
  const c=SB.cfg();if(!c)return;
  const dados={};
  for(const t of TABLES){try{dados[t]=await SB.list(c,t)||[];}catch(e){
    // tabela ainda não criada (ex.: racoes antes da migração) → segue com vazio
    dados[t]=[];if(t==='racoes')setTimeout(()=>toast('⚠️ Aba Rações: rode a migração no Supabase para sincronizar (⚙️ Configurações → Ver migração)','warn',6000),1200);}}
  const localAntes={};for(const t of TABLES)localAntes[t]=S[t]||[];
  // normaliza (numeric volta como string via PostgREST)
  S.contas=dados.contas.map(r=>({...r,saldoInicial:r2(r.saldoInicial),meta:r.meta==null?null:r2(r.meta)}));
  S.cartoes=dados.cartoes.map(r=>({...r,tipo:r.tipo||'credito',diaFechamento:+r.diaFechamento||20,diaVencimento:+r.diaVencimento||5,limite:r.limite==null?null:r2(r.limite),saldoInicial:r2(r.saldoInicial||0)}));
  S.categorias=dados.categorias.map(r=>({...r}));
  S.lancamentos=dados.lancamentos.map(r=>({...r,valor:r2(r.valor),pago:!!r.pago}));
  S.racoes=(dados.racoes||[]).map(r=>({...r,kg:r2(r.kg||0),kgRestante:(r.kgRestante==null||r.kgRestante==='')?null:r2(r.kgRestante),custoTotal:(r.custoTotal==null||r.custoTotal==='')?null:r2(r.custoTotal),especie:r.especie||'gatos'}));
  // migração: tabela remota vazia + dados locais → envia (e mantém os dados na tela)
  let migrou=false;
  for(const t of TABLES){
    if((dados[t]||[]).length===0&&localAntes[t].length){
      try{await SB.upsert(c,t,localAntes[t].map(cleanRow));S[t]=localAntes[t];migrou=true;}
      catch(e){console.warn('migração falhou em '+t,e);}}}
  if(migrou)toast('📦 Dados locais enviados para o Supabase','ok');
  persistLocal();
}

/* ---- mutações (local sempre; remoto em paralelo) ---- */
function addLocal(t,row){S[t].push(row);persistLocal();syncRemoto(c=>SB.insert(c,t,cleanRow(row)));}
function updLocal(t,id,patch){const i=S[t].findIndex(x=>x.id===id);if(i<0)return;S[t][i]=Object.assign({},S[t][i],patch);persistLocal();syncRemoto(c=>SB.update(c,t,id,cleanRow(patch)));}
function delLocal(t,id){S[t]=S[t].filter(x=>x.id!==id);persistLocal();syncRemoto(c=>SB.remove(c,t,id));}

/* ---- toast ---- */
function toast(msg,tipo='',ms=2600){const el=document.createElement('div');el.className='toast '+tipo;el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),320);},ms);}

/* ---- getters ---- */
const contaById=id=>S.contas.find(c=>c.id===id);
const cartaoById=id=>S.cartoes.find(c=>c.id===id);
const catById=id=>S.categorias.find(c=>c.id===id);
const lancamentoById=id=>S.lancamentos.find(l=>l.id===id);
const racaoById=id=>S.racoes.find(r=>r.id===id);

/* ---- Rações (proteção animal) ---- */
const ESPECIES=[{k:'gatos',n:'Gatos',e:'🐱',cor:'#5C93A6'},{k:'caes',n:'Cães',e:'🐶',cor:'#E09A85'},{k:'coelhos',n:'Coelhos',e:'🐰',cor:'#A9A3D8'}];
const espBy=k=>ESPECIES.find(x=>x.k===k)||ESPECIES[0];
function racaoDias(a,b){return Math.max(1,Math.round((parseISO(b).getTime()-parseISO(a).getTime())/864e5)+1);}
function racaoFimEfetivo(r){return r.fim||todayISO();}
/* kg já consumidos: ração acabada = kg total; em uso com pesagem = kg − restante; sem pesagem = null (só estimativa) */
function racaoConsumidoKg(r){if(r.fim)return r2(r.kg);if(r.kgRestante!=null)return Math.max(0,r2(r.kg-(r.kgRestante||0)));return null;}
/* kg/dia para gráficos: acabada = total/dias; em uso = consumido (ou total, se sem pesagem) espalhado até hoje */
function racaoKgDia(r){
  if(r.fim)return r2(r.kg/racaoDias(r.abertura,r.fim));
  const cons=r.kgRestante!=null?Math.max(0,r2(r.kg-(r.kgRestante||0))):r.kg;
  return r2(cons/racaoDias(r.abertura,todayISO()));}
function racaoCusto(r){if(r.lancamentoId){const l=lancamentoById(r.lancamentoId);if(l)return l.valor;}return r2(r.custoTotal||0);}
function racaoCustoKg(r){const c=racaoCusto(r);return (c>0&&r.kg>0)?r2(c/r.kg):null;}
/* consumo estimado por mês: cada ração espalha kg/dia nos dias que o mês e a ração compartilham */
function racoesMensal(mkList){return mkList.map(mk=>{const mFim=monthEndISO(mk+'-01'),mIni=mk+'-01';
  let kg=0,custo=0,n=0;
  for(const r of S.racoes){const fe=racaoFimEfetivo(r);
    const ini=r.abertura>mIni?r.abertura:mIni;const fim=fe<mFim?fe:mFim;
    if(ini>fim)continue;kg+=racaoKgDia(r)*racaoDias(ini,fim);
    if(monthKey(r.abertura)===mk){custo+=racaoCusto(r);n++;}}
  return{mk,kg:r2(kg),custo:r2(custo),n};});}

/* ============ cálculos ============ */
/* Lançamentos: tipo 'receita' | 'despesa' | 'pagamento_cartao' | 'carga_cartao'.
   receita/despesa em conta → movimenta saldo da conta.
   despesa com cartaoId → entra na dívida do cartão de crédito OU reduz o saldo do pré-pago.
   pagamento_cartao → sai da conta informada e reduz a dívida do cartão.
   carga_cartao → crédito recebido num cartão de alimentação (aumenta o saldo; não toca conta). */
function cartaoBenef(k){return k&&((k.tipo||'credito')==='alimentacao');}
function movConta(l,contaId){if(l.contaId!==contaId)return 0;
  if(l.tipo==='receita')return l.valor;
  if(l.tipo==='despesa')return -l.valor;
  if(l.tipo==='pagamento_cartao')return -l.valor;
  return 0;}
function saldoConta(contaId,ateISO){const c=contaById(contaId);if(!c)return 0;let s=+c.saldoInicial||0;
  for(const l of S.lancamentos)if(!l.cartaoId||l.tipo==='pagamento_cartao'){if(ateISO&&l.data>ateISO)continue;s+=movConta(l,contaId);}
  return r2(s);}
function dividaCartao(cartaoId,ateISO){const k=cartaoById(cartaoId);if(cartaoBenef(k))return 0;let s=0;
  for(const l of S.lancamentos){if(ateISO&&l.data>ateISO)continue;
    if(l.tipo==='despesa'&&l.cartaoId===cartaoId)s+=l.valor;
    if(l.tipo==='pagamento_cartao'&&l.cartaoId===cartaoId)s-=l.valor;}
  return r2(Math.max(0,s));}
/* saldo de cartão pré-pago (alimentação/refeição): saldoInicial + cargas − despesas até a data */
function saldoCartaoAlimentacao(cartaoId,ateISO){const k=cartaoById(cartaoId);if(!k)return 0;let s=+k.saldoInicial||0;
  for(const l of S.lancamentos){if(l.cartaoId!==cartaoId)continue;if(ateISO&&l.data>ateISO)continue;
    if(l.tipo==='carga_cartao')s+=l.valor;
    else if(l.tipo==='despesa')s-=l.valor;}
  return r2(s);}
function saldoPrepagos(ateISO){let s=0;for(const k of S.cartoes)if(cartaoBenef(k))s+=saldoCartaoAlimentacao(k.id,ateISO);return r2(s);}
function totais(ateISO){let contas=0,divida=0;
  for(const c of S.contas)contas+=saldoConta(c.id,ateISO);
  for(const k of S.cartoes)divida+=dividaCartao(k.id,ateISO);
  return{contas:r2(contas),divida:r2(divida),liquido:r2(contas-divida)};}
function movMesConta(mk){let rec=0,des=0;for(const l of S.lancamentos){if(monthKey(l.data)!==mk)continue;if(l.tipo==='receita'&&l.contaId)rec+=l.valor;if(l.tipo==='despesa'&&l.contaId)des+=l.valor;}return{rec:r2(rec),des:r2(des)};}
function totalPorCategoria(tipo,deISO,ateISO,filt){const map=new Map();
  for(const l of S.lancamentos){if(tipo==='despesa'&&l.tipo!=='despesa')continue;if(tipo==='receita'&&l.tipo!=='receita')continue;
    if(deISO&&l.data<deISO)continue;if(ateISO&&l.data>ateISO)continue;
    if(filt){if(filt.contaId&&l.contaId!==filt.contaId)continue;if(filt.cartaoId&&l.cartaoId!==filt.cartaoId)continue;if(filt.titular&&l.titular!==filt.titular)continue;}
    const k=l.categoriaId||'sem';map.set(k,(map.get(k)||0)+l.valor);}
  return map;}
function mesesPara(mk,n){const[y,m]=mk.split('-').map(Number);const out=[];for(let i=n-1;i>=0;i--){const d=new Date(y,m-1-i,1);out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}return out;}

/* ---- faturas ---- */
function faturaDeData(cartao,dataISO){
  const F=clamp(+cartao.diaFechamento||1,1,31),V=clamp(+cartao.diaVencimento||10,1,31);
  const d=parseISO(dataISO);
  let anchor=new Date(d.getFullYear(),d.getMonth(),1);
  if(d.getDate()>F)anchor=new Date(d.getFullYear(),d.getMonth()+1,1);
  const venc=new Date(anchor.getFullYear(),anchor.getMonth()+(V<=F?1:0),1);
  venc.setDate(Math.min(V,new Date(venc.getFullYear(),venc.getMonth()+1,0).getDate()));
  const fim=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);
  fim.setDate(Math.min(F,fim.getDate()));
  const ini=new Date(anchor.getFullYear(),anchor.getMonth()-1,1);
  const lastPrev=new Date(anchor.getFullYear(),anchor.getMonth(),0).getDate();
  ini.setDate(Math.min(F+1,lastPrev));
  return{ini:toISO(ini),fim:toISO(fim),venc:toISO(venc)};
}
function itensFatura(cartao,per){return S.lancamentos.filter(l=>l.cartaoId===cartao.id&&l.tipo!=='pagamento_cartao'&&l.data>=per.ini&&l.data<=per.fim);}
function faturaAtual(cartao){if(cartaoBenef(cartao))return{per:faturaDeData(cartao,todayISO()),aberta:0,itens:[]};
  const per=faturaDeData(cartao,todayISO());const itens=itensFatura(cartao,per);
  return{per,aberta:r2(itens.reduce((s,l)=>s+l.valor,0)),itens};}
function proximasFaturas(cartao,n=3){const out=[];let base=todayISO();
  for(let i=0;i<n;i++){const f=faturaDeData(cartao,base);const itens=itensFatura(cartao,f);
    const pagos=S.lancamentos.filter(l=>l.cartaoId===cartao.id&&l.tipo==='pagamento_cartao'&&l.data>=f.ini&&l.data<=f.fim).reduce((s,l)=>s+l.valor,0);
    out.push({per:f,total:r2(itens.reduce((s,l)=>s+l.valor,0)),pago:r2(pagos),n:itens.length});
    base=addDaysISO(f.fim,1);}
  return out;}

/* ---- projeção ---- */
function projecao(ateISO){
  const hoje=todayISO();
  const porConta=S.contas.map(c=>({conta:c,saldo:saldoConta(c.id,ateISO)}));
  const porCartao=S.cartoes.map(k=>({cartao:k,divida:dividaCartao(k.id,ateISO)}));
  const benef=S.cartoes.filter(cartaoBenef).map(k=>({cartao:k,saldo:saldoCartaoAlimentacao(k.id,ateISO)}));
  const t={contas:r2(porConta.reduce((s,x)=>s+x.saldo,0)),divida:r2(porCartao.reduce((s,x)=>s+x.divida,0))};
  t.liquido=r2(t.contas-t.divida);
  const eventos=S.lancamentos.filter(l=>l.data>hoje&&l.data<=ateISO).sort((a,b)=>a.data<b.data?-1:1);
  const faturasPeriodo=[];
  for(const k of S.cartoes.filter(k=>!cartaoBenef(k))){let base=hoje;let guard=0;
    while(guard++<24){const f=faturaDeData(k,base);if(f.venc>ateISO)break;
      const itens=itensFatura(k,f);const pagos=S.lancamentos.filter(l=>l.cartaoId===k.id&&l.tipo==='pagamento_cartao'&&l.data>=f.ini&&l.data<=f.fim).reduce((s,l)=>s+l.valor,0);
      const total=r2(itens.reduce((s,l)=>s+l.valor,0));
      if(f.venc>hoje)faturasPeriodo.push({cartao:k,fat:f,total,pagado:r2(pagos),n:itens.length});
      base=addDaysISO(f.fim,1);}}
  faturasPeriodo.sort((a,b)=>a.fat.venc<b.fat.venc?-1:1);
  return{ate:ateISO,...t,porConta,porCartao,benef,eventos,faturasPeriodo};
}
function curvaProjecao(deISO,ateISO,maxPts=42){
  const d1=parseISO(deISO).getTime(),d2=parseISO(ateISO).getTime();
  const n=Math.min(maxPts,Math.max(2,Math.round((d2-d1)/864e5)));
  const pts=[];for(let i=0;i<n;i++){const iso=toISO(new Date(d1+(d2-d1)*i/(n-1)));pts.push({data:iso,v:projecao(iso).liquido});}
  return pts;
}

/* ---- gráficos SVG ---- */

function lineSVG(pts,H=200){if(pts.length<2)return'';const vals=pts.map(p=>p.v);
  const min=Math.min(...vals,0),max=Math.max(...vals,1);const W=560;
  const X=i=>14+(W-28)*i/(pts.length-1);const Y=v=>18+(H-52)*(1-(v-min)/(max-min||1));
  const zero=Y(0);
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=path+` L${X(pts.length-1)},${zero} L${X(0)},${zero} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${pts.length>14?2.6:4.4}" fill="var(--teal)" stroke="#fff" stroke-width="1.6"><title>${fmtData(p.data)}: ${brl(p.v)}</title></circle>`).join('');
  const lbl=(i,txt)=>`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64818F" font-family="Manrope">${txt}</text>`;

function lanFiltDefault(){return{de:'',ate:'',tipo:'',contaId:'',cartaoId:'',categoriaId:'',titular:'',q:''};}
if(!S.ui.lanFilt)S.ui.lanFilt=lanFiltDefault();
function lanFiltrados(){const f=S.ui.lanFilt;
  return S.lancamentos.filter(l=>{
    if(f.de&&l.data<f.de)return false;
    if(f.ate&&l.data>f.ate)return false;
    if(f.tipo==='cartao'&&!(l.tipo==='despesa'&&l.cartaoId))return false;
    if(f.tipo&&f.tipo!=='cartao'&&l.tipo!==f.tipo)return false;
    if(f.contaId&&l.contaId!==f.contaId)return false;
    if(f.cartaoId&&l.cartaoId!==f.cartaoId)return false;
    if(f.categoriaId&&(l.categoriaId||'')!==f.categoriaId)return false;
    if(f.titular&&l.titular!==f.titular)return false;
    if(f.q&&!String(l.descricao||'').toLowerCase().includes(f.q.toLowerCase()))return false;
    return true;}).sort((a,b)=>b.data<a.data?-1:b.data>a.data?1:0);}

  <div class="kpis" style="margin-bottom:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">

function wireAcoesComuns(v){
  v.querySelectorAll('[data-newlan]').forEach(b=>b.onclick=()=>formLancamento());
  v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const l=S.lancamentos.find(x=>x.id===b.dataset.edit);if(l)formLancamento(l);});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const l=S.lancamentos.find(x=>x.id===b.dataset.del);if(!l)return;
    if(await confirmAcao(`Excluir lançamento?`,`<b>${esc(l.descricao)}</b> · ${brl(l.valor)} · ${fmtData(l.data)}`,'Excluir')){
      delLocal('lancamentos',l.id);toast('Lançamento excluído','ok');render();}});
  v.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>criarDemo());
}
function exportarCSV(){const lista=lanFiltrados();
  if(!lista.length){toast('Nenhum lançamento no filtro','warn');return;}
  const linhas=[['data','descricao','tipo','valor','categoria','conta','cartao','membro','status','observacoes'].join(';')];
  for(const l of lista){const c=catById(l.categoriaId),cc=contaById(l.contaId),k=cartaoById(l.cartaoId);
    linhas.push([l.data,l.descricao,l.tipo,String(l.valor).replace('.',','),c?c.nome:'',cc?cc.nome:'',k?k.nome:'',l.titular||'',l.pago?'pago':'agendado',l.observacoes||''].map(x=>String(x).replace(/;/g,',').replace(/\n/g,' ')).join(';'));}
  baixarArquivo('mar-aberto-lancamentos.csv',new Blob(['\uFEFF'+linhas.join('\n')],{type:'text/csv;charset=utf-8'}));
  toast('CSV exportado ✔','ok');}
function baixarArquivo(nome,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

/* ============ CARTÕES ============ */
function cardGrad(cor){return `background:linear-gradient(135deg, ${cor} 0%, ${shade(cor,-28)} 100%);`;}
function shade(hex,p){const h=hex.replace('#','');let[r,g,b]=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)].map(x=>clamp(Math.round(x+p),0,255));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function renderCartoes(v){
  const t=totais(todayISO());
  const benef=S.cartoes.filter(cartaoBenef);const credito=S.cartoes.filter(k=>!cartaoBenef(k));
  const sPre=saldoPrepagos(todayISO());
  const contasResumo=S.contas.map(c=>({nome:c.nome,v:saldoConta(c.id,todayISO())}));

    if(f.categoriaId&&(l.categoriaId||'')!==f.categoriaId)return false;
    if(f.contaId&&l.contaId!==f.contaId)return false;

    ${kpi('t-coral','⬇️','Despesas',brl(des),lista.filter(l=>l.tipo==='despesa').length+' lançamento(s)')}

      <div class="cols" style="grid-template-columns:180px 1fr">${donutSVG(recCat.slice(0,8),180)}<div>${legendSVG(recCat.slice(0,8))}</div></div></div>

  wireAcoesComuns(v);

/* ============ FRENTE RAÇÕES (proteção animal) ============
   Cada ração = um saco/embalagem: nome, espécie, kg, data de abertura e fim.
   Em uso = saco aberto ainda (fim vazio); pode registrar o peso na balança para refinar.
   O custo vem do lançamento de compra vinculado (Financeiro) ou do custo manual. */
function fmtKg(kg){return (kg==null?'—':kg.toLocaleString('pt-BR',{maximumFractionDigits:1}))+' kg';}
function ultimosMk(n){const d=parseISO(todayISO());const out=[];for(let i=n-1;i>=0;i--){const dd=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(monthKey(toISO(dd)));}return out;}

function renderRacoes(v){
  const emUso=S.racoes.filter(r=>!r.fim);
  const mk=monthKey(todayISO());const mes=racoesMensal([mk])[0];
  const custoTotal=S.racoes.reduce((s,r)=>s+racaoCusto(r),0);
  const estoque=S.racoes.reduce((s,r)=>s+(r.kgRestante!=null?Math.max(0,r2(r.kg-(r.kgRestante||0))):0),0);
  const views=[['gantt','🗺️ Gantt'],['mensal','📊 Consumo mensal'],['especies','🐾 Por espécie'],['lista','📋 Todas']];
  const semDados=!S.racoes.length;
  v.innerHTML=`${secHead('🐾 Rações','Acompanhamento do consumo das rações da proteção animal — gatos, cães e coelhos: quando cada saco abriu, quanto dura e quanto custa.',
    `<button class="btn btn-primary" data-newracao>${ic('plus')} Nova ração</button>`)}
  ${semDados?`<div class="note" style="margin-bottom:16px">🐾 Bem-vindo à frente Rações! Cadastre cada saco com <b>nome, espécie, kg e a data de abertura</b> — e vincule a compra no Financeiro para acompanhar o custo. Ou <button class="btn btn-sm btn-soft" data-racaodemo>✨ Criar rações de exemplo</button></div>`:''}
  <div class="kpis">
    ${kpi('t-green','🐾','Rações em uso',String(emUso.length),emUso.length?emUso.map(r=>`${espBy(r.especie).e} ${esc(r.nome)}`).join(' · '):'nenhuma aberta agora')}
    ${kpi('t-teal','🥣','Consumo do mês (est.)',fmtKg(mes.kg),semDados?'cadastre rações para ver':'estimativa distribuída pelos dias de uso')}
    ${kpi('t-coral','💰','Custo das rações',custoTotal>0?brl(custoTotal):'—',`compras vinculadas ou custo manual${mes.custo>0?` · ${brl(mes.custo)} este mês`:''}`)}
    ${kpi('t-amber','📦','Estoque pesado',estoque>0?fmtKg(estoque):'—','kg restantes nas pesagens registradas')}
  </div>
  <div class="seg" id="segRacaoView" style="margin-bottom:16px">${views.map(([k,n])=>`<button type="button" data-v="${k}" class="${(S.ui.racaoView||'gantt')===k?'on':''}">${n}</button>`).join('')}</div>
  <div id="racaoView">${({gantt:ganttRacoes,mensal:mensalRacoes,especies:especiesRacoes,lista:listaRacoes})[S.ui.racaoView||'gantt']()}</div>`;
  v.querySelectorAll('#segRacaoView [data-v]').forEach(b=>b.onclick=()=>{S.ui.racaoView=b.dataset.v;render();});
  v.querySelectorAll('[data-newracao]').forEach(b=>b.onclick=()=>formRacao());
  v.querySelectorAll('[data-editracao]').forEach(b=>b.onclick=()=>{const r=racaoById(b.dataset.editracao);if(r)formRacao(r);});
  v.querySelectorAll('[data-delracao]').forEach(b=>b.onclick=async()=>{
    const r=racaoById(b.dataset.delracao);if(!r)return;
    if(await confirmAcao('Excluir ração?',`<b>${esc(r.nome)}</b> · ${fmtKg(r.kg)} · aberta ${fmtDataCurta(r.abertura)}`,'Excluir')){
      delLocal('racoes',r.id);toast('Ração excluída','ok');render();}});
  v.querySelectorAll('[data-racaodemo]').forEach(b=>b.onclick=()=>racoesDemo());
}

/* ---- Gantt: cada ração é uma barra da abertura ao fim (em uso vai até hoje) ---- */
function ganttRacoes(){
  const rows=[...S.racoes].sort((a,b)=>a.abertura<b.abertura?-1:1);
  if(!rows.length)return `<div class="card"><div class="empty" style="padding:22px"><span class="em">🗺️</span><b>Sem rações ainda</b>Cadastre a primeira ração para ver a linha do tempo do consumo.</div></div>`;
  const hoje=todayISO();
  const t0=rows.reduce((m,r)=>r.abertura<m?r.abertura:m,hoje).slice(0,7)+'-01';
  const t1raw=rows.reduce((m,r)=>{const f=racaoFimEfetivo(r);return f>m?f:m;},hoje);
  const t1=monthEndISO(t1raw);
  const d0=parseISO(t0).getTime(),d1=parseISO(t1).getTime()+864e5;const span=Math.max(1,d1-d0);
  const ms=[];let y=+t0.slice(0,4),m=+t0.slice(5,7);const fim=+t1.slice(0,4)*100+ +t1.slice(5,7);
  while(y*100+m<=fim){ms.push(`${y}-${String(m).padStart(2,'0')}`);m++;if(m>12){m=1;y++;}}
  const diasMes=mk=>racaoDias(mk+'-01',monthEndISO(mk+'-01'));
  const head=`<div style="display:flex;min-width:640px;border-bottom:1px solid var(--line)">
    <div style="width:150px;min-width:150px"></div>
    <div style="flex:1;display:flex">${ms.map(mk=>`<div style="flex:${diasMes(mk)};text-align:center;font-size:.72rem;font-weight:800;color:var(--ink-faint);border-left:1px solid var(--line-soft);padding:4px 0">${fmtMes(mk)}</div>`).join('')}</div></div>`;
  const xHoje=(parseISO(hoje).getTime()+864e5-d0)/span*100;
  const linhaHoje=(xHoje>0&&xHoje<100)?`<div style="position:absolute;top:0;bottom:0;left:${xHoje}%;width:2px;background:var(--coral);opacity:.55;pointer-events:none" title="hoje"></div>`:'';
  const body=rows.map(r=>{const esp=espBy(r.especie);const fe=racaoFimEfetivo(r);
    const left=(parseISO(r.abertura).getTime()-d0)/span*100;
    const width=(parseISO(fe).getTime()+864e5-parseISO(r.abertura).getTime())/span*100;
    const kgd=racaoKgDia(r);
    return `<div style="display:flex;align-items:center;min-width:640px;border-top:1px dashed var(--line-soft)">
      <div style="width:150px;min-width:150px;font-size:.8rem;font-weight:800;padding:7px 8px 7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(r.nome)}">${esp.e} ${esc(r.nome)}</div>
      <div style="flex:1;position:relative;height:42px">
        ${linhaHoje}
        <div style="position:absolute;left:${left}%;width:${Math.max(width,.6)}%;top:7px;bottom:7px;background:linear-gradient(100deg,${esp.cor},${esp.cor}b3);border-radius:9px;color:#fff;font-size:.72rem;font-weight:800;display:flex;align-items:center;padding:0 9px;white-space:nowrap;overflow:hidden;box-shadow:var(--shadow);${r.fim?'':'border-right:3px dashed rgba(255,255,255,.92)'}" title="${esc(r.nome)} · ${fmtKg(r.kg)} · ${r.fim?'finalizada':'em uso'}${kgd!=null?` · ~${fmtKg(kgd)}/dia`:''}">${esc(r.nome)} · ${fmtKg(r.kg)}${r.fim?'':' · em uso'}</div>
      </div></div>`;}).join('');
  return `<div class="card"><div class="card-h"><h3>🗺️ Linha do tempo (Gantt)</h3><span class="hint">cada barra é uma ração — da abertura ao fim</span></div>
    <div style="overflow-x:auto">${head}${body}</div>
    <div class="hint" style="margin-top:8px">A linha coral é hoje. Barra com borda tracejada = ração ainda em uso. Em um celular, arraste para o lado.</div></div>`;
}

/* ---- consumo mensal estimado (últimos 6 meses) ---- */
function mensalRacoes(){
  if(!S.racoes.length)return `<div class="card"><div class="empty" style="padding:22px"><span class="em">📊</span><b>Sem rações ainda</b></div></div>`;
  const dados=racoesMensal(ultimosMk(6));const max=Math.max(...dados.map(d=>d.kg),1);
  return `<div class="card"><div class="card-h"><h3>📊 Consumo por mês (estimado)</h3><span class="hint">kg distribuídos nos dias de uso</span></div>
    <div style="display:flex;align-items:flex-end;gap:10px;height:190px;padding:6px 4px 0">
      ${dados.map(d=>{const h=Math.max(Math.round(d.kg/max*130),d.kg>0?6:2);
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
          <b style="font-size:.78rem;color:var(--ink-soft)">${d.kg>0?fmtKg(d.kg):'—'}</b>
          <div style="width:70%;max-width:64px;height:${h}px;background:linear-gradient(180deg,var(--teal),var(--teal-deep));border-radius:8px 8px 4px 4px;opacity:.92"></div>
        </div>`;}).join('')}
    </div>
    <div style="display:flex;gap:10px;border-top:1px solid var(--line-soft);margin-top:8px;padding:8px 4px 2px">
      ${dados.map(d=>`<div style="flex:1;text-align:center"><div style="font-size:.74rem;font-weight:800;color:var(--ink-faint)">${fmtMes(d.mk)}</div><div style="font-size:.7rem;color:var(--ink-faint)">${d.custo>0?brl(d.custo)+' em compras':'sem compras'}</div></div>`).join('')}
    </div>
    <div class="hint" style="margin-top:8px">Rações em uso sem pesagem: o kg total é espalhado da abertura até hoje — registre o ⚖️ peso atual na ração para ficar mais preciso.</div></div>`;
}

/* ---- resumo por espécie ---- */
function especiesRacoes(){
  if(!S.racoes.length)return `<div class="card"><div class="empty" style="padding:22px"><span class="em">🐾</span><b>Sem rações ainda</b></div></div>`;
  return `<div class="card"><div class="card-h"><h3>🐾 Por espécie</h3><span class="hint">tudo o que já passou pelas tigelas</span></div>
    <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">
    ${ESPECIES.map(esp=>{const rs=S.racoes.filter(r=>(r.especie||'gatos')===esp.k);
      const kg=rs.reduce((s,r)=>s+(racaoConsumidoKg(r)!=null?racaoConsumidoKg(r):r.kg),0);
      const custo=rs.reduce((s,r)=>s+racaoCusto(r),0);
      const kgTot=rs.reduce((s,r)=>s+r.kg,0);
      return `<div style="background:${hexSoft(esp.cor,.13)};border-radius:14px;padding:14px">
        <div style="font-weight:900;color:var(--ink)">${esp.e} ${esp.n}</div>
        <div style="font-size:.8rem;color:var(--ink-soft);margin:4px 0 8px">${rs.length} ração(ões) · ${rs.filter(r=>!r.fim).length} em uso</div>
        <div style="font-size:.82rem;line-height:1.75">
          <div>Consumido: <b>${fmtKg(kg)}</b></div>
          <div>Custo das compras: <b>${custo>0?brl(custo):'—'}</b></div>
          <div>Custo médio: <b>${kgTot>0&&custo>0?brl(r2(custo/kgTot))+'/kg':'—'}</b></div>
        </div></div>`;}).join('')}</div></div>`;
}

/* ---- form ração ---- */
function formRacao(l){
  const novo=!l;const r=l||{};
  const despesas=[...S.lancamentos].filter(x=>x.tipo==='despesa').sort((a,b)=>b.data<a.data?1:-1).slice(0,40);
  const usados=new Set(S.racoes.filter(x=>x.id!==r.id).map(x=>x.lancamentoId).filter(Boolean));
  const opts=despesas.filter(x=>!usados.has(x.id));
  let curEsp=r.especie||'gatos';
  openModal(`<div class="modal-h"><h2>${novo?'🐾 Nova ração':'✏️ Editar ração'}</h2><button class="iconbtn" onclick="closeModal()">${ic('x')}</button></div>
  <div class="field"><label>Nome <span class="opt">(marca + embalagem, ex.: “Golden Gatos 10,1 kg”)</span></label><input class="input" id="rNome" value="${esc(r.nome||'')}" placeholder="ex.: Golden Gatos 10,1 kg"></div>
  <div class="frow">
    <div class="field"><label>Espécie</label><div class="seg" id="segEsp">${ESPECIES.map(e=>`<button type="button" data-e="${e.k}" class="${curEsp===e.k?'on':''}">${e.e} ${e.n}</button>`).join('')}</div></div>
    <div class="field"><label>Quantidade (kg)</label><input class="input" id="rKg" inputmode="decimal" placeholder="0,0" value="${r.kg!=null?String(r.kg).replace('.',','):''}"></div>
  </div>
  <div class="frow">
    <div class="field"><label>Data de abertura</label><input type="date" class="input" id="rAbertura" value="${r.abertura||todayISO()}"></div>
    <div class="field" id="rFimWrap" style="${r.fim?'':'display:none'}"><label>Data de fim <span class="opt">(quando o saco acabou)</span></label><input type="date" class="input" id="rFim" value="${r.fim||''}"></div>
  </div>
  <div class="field"><div class="switchline"><input type="checkbox" id="rEmUso" ${!r.fim?'checked':''}> <span>esta ração ainda está <b>em uso</b> — desmarque quando o saco acabar</span></div></div>
  <div class="frow">

/* ---- modal / confirm ---- */
function openModal(html,wide){$('#modalRoot').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal ${wide?'wide':''}">${html}</div></div>`;
  $('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal();};}
function closeModal(){$('#modalRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function confirmAcao(titulo,html,label='Excluir'){return new Promise(res=>{
  openModal(`<div class="modal-h"><h2>${titulo}</h2><button class="iconbtn" onclick="closeModal()">${ic('x')}</button></div>
  <div style="font-size:.95rem">${html}</div>
  <div class="modal-f"><button class="btn btn-ghost" id="cNao">Cancelar</button><button class="btn btn-danger" id="cSim">${esc(label)}</button></div>`);
  $('#cNao').onclick=()=>{closeModal();res(false);};$('#cSim').onclick=()=>{closeModal();res(true);};});}

/* ---- chips de titular ---- */
function titularChips(sel,id='titChips'){return `<div class="chips-members" id="${id}">${(S.settings.membros||[]).map(m=>`<button type="button" data-m="${esc(m)}" class="${sel===m?'on':''}">${esc(m)}</button>`).join('')}</div>`;}

/* ---- swatches ---- */
function swatchHTML(sel,name='cor'){return `<div class="swatches">${PALETA.map(c=>`<button type="button" class="${sel===c?'on':''}" data-swatch="${c}" style="background:${c}"></button>`).join('')}</div><input type="hidden" id="${name}" value="${sel}">`;}

/* ---- prévia do parcelamento: N× o valor, com faturas pelo ciclo do cartão ---- */
function prevParcelas(){
  const bp=document.getElementById('blocoParcelas');if(!bp)return;
  const sk=document.getElementById('fCartao');const kk=sk?cartaoById(sk.value):null;
  if(!kk||cartaoBenef(kk)){bp.style.display='none';return;}
  bp.style.display='';
  const pv=document.getElementById('previewParcelas');if(!pv)return;
  const n=clamp(Math.round(num((document.getElementById('fParcelas')||{value:1}).value)||1),1,36);
  const v=num((document.getElementById('fValor')||{}).value);const d0=(document.getElementById('fData')||{}).value;
  if(n>1&&v>0&&d0){const por=r2(v/n);
    const f0=faturaDeData(kk,d0),fN=faturaDeData(kk,addMonthsISO(d0,n-1));
    pv.innerHTML=`<div class="note" style="margin-top:8px">🧩 ${n}× de <b>${brl(por)}</b> — primeira fatura vence <b>${fmtData(f0.venc)}</b>, última <b>${fmtData(fN.venc)}</b>.</div>`;}
  else pv.innerHTML='';
}

  const des=$('#sbDesligar');if(des)des.onclick=()=>{SB.set(null);toast('Modo local ativado','ok');closeModal();updateDbPill();render();};
  let sqlAtual=SQL_SETUP;
  $('#sbSql').onclick=()=>{sqlAtual=SQL_SETUP;$('#sbSqlBox').style.display='block';$('#sqlTxt').textContent=SQL_SETUP;};
  $('#sbSqlMigra')&&($('#sbSqlMigra').onclick=()=>{sqlAtual=SQL_MIGRA;$('#sbSqlBox').style.display='block';$('#sqlTxt').textContent=SQL_MIGRA;});
  $('#sbCopiar')&&($('#sbCopiar').onclick=()=>{navigator.clipboard.writeText(sqlAtual).then(()=>toast('SQL copiado ✔','ok')).catch(()=>toast('Selecione e copie manualmente','warn'));});
  $('#mAdd').onclick=()=>{const v=$('#mNovo').value.trim();if(!v)return;
    S.settings.membros=[...new Set([...(S.settings.membros||[]),v])];persistLocal();toast('Membro adicionado','ok');formConfig();};
  document.querySelectorAll('[data-rmmember]').forEach(b=>b.onclick=()=>{S.settings.membros.splice(+b.dataset.rmmember,1);persistLocal();formConfig();});
  $('#logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{const max=512;const sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);S.settings.logo=cv.toDataURL('image/png');
      persistLocal();renderBrand();toast('✅ Logo atualizado','ok');formConfig();};img.src=rd.result;};rd.readAsDataURL(f);};
  const lr=$('#logoReset');if(lr)lr.onclick=()=>{S.settings.logo=null;persistLocal();renderBrand();formConfig();};
  $('#bkExport').onclick=()=>{baixarArquivo('mar-aberto-backup-'+todayISO()+'.json',new Blob([JSON.stringify({contas:S.contas,cartoes:S.cartoes,categorias:S.categorias,lancamentos:S.lancamentos,racoes:S.racoes,settings:S.settings},null,1)],{type:'application/json'}));toast('Backup gerado ✔','ok');};
  $('#bkImport').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=async()=>{try{const d=JSON.parse(rd.result);
      if(await confirmAcao('Restaurar backup?',`Vai substituir os dados atuais por: <b>${(d.contas||[]).length} contas · ${(d.cartoes||[]).length} cartões · ${(d.categorias||[]).length} categorias · ${(d.lancamentos||[]).length} lançamentos · ${(d.racoes||[]).length} rações</b>.`,'Restaurar')){
        S.contas=d.contas||[];S.cartoes=d.cartoes||[];S.categorias=d.categorias||[];S.lancamentos=d.lancamentos||[];S.racoes=d.racoes||[];
        if(d.settings)S.settings=Object.assign(S.settings,d.settings);persistLocal();
        const c=SB.cfg();if(c){toast('Enviando ao Supabase…');for(const t of TABLES)await SB.upsert(c,t,(S[t]||[]).map(cleanRow));}
        toast('✅ Backup restaurado','ok');closeModal();render();}}catch(err){toast('Arquivo inválido: '+err.message,'err');}};
    rd.readAsText(f);};
  $('#bkDemo').onclick=()=>{closeModal();criarDemo();};
  $('#bkZerar').onclick=async()=>{
    if(await confirmAcao('Zerar todos os dados?','Isso apaga <b>contas, cartões, categorias, lançamentos e rações</b> deste navegador.'+(SB.cfg()?' O que já está no Supabase continua lá; ao reconectar, o app puxa os dados de volta.':''),'Apagar tudo')){
      S.contas=[];S.cartoes=[];S.categorias=[];S.lancamentos=[];S.racoes=[];persistLocal();seedCategorias();toast('Dados zerados','ok');closeModal();render();}};
}

/* ---- seed categorias ---- */
function seedCategorias(){if(S.categorias.length)return;let i=0;
  for(const[nome,tipo,icone,cor]of CATS_SEED){addLocal('categorias',{id:uid(),criadoEm:new Date().toISOString(),nome,tipo,icone,cor,sistema:true});i++;}
  return i;}

/* ---- dados de exemplo ---- */
function criarDemo(){
  confirmAcao('Criar dados de exemplo?',`Vou cadastrar <b>3 contas</b> (sua, da sua esposa e da filha), <b>3 cartões</b> — 2 de crédito e 1 pré-pago de alimentação — <b>mais de 100 lançamentos</b> (com compra parcelada em 6×) e <b>4 rações</b> para a aba 🐾 (gatos, cães e coelhos, uma com compra vinculada). Depois é só editar ou zerar em Configurações.`,'Criar exemplos').then(ok=>{
    if(!ok)return;
    seedCategorias();
    const cat=n=>(S.categorias.find(c=>c.nome.startsWith(n))||{}).id;
    const t=new Date();const hoje=todayISO();
    const mk=(mOffset,day)=>{const d=new Date(t.getFullYear(),t.getMonth()+mOffset,Math.min(day,new Date(t.getFullYear(),t.getMonth()+mOffset+1,0).getDate()));return toISO(d);};
    const cEu={id:uid(),criadoEm:new Date().toISOString(),nome:'Nubank da família',banco:'nubank',tipo:'corrente',titular:'Eu',saldoInicial:3200,meta:10000,cor:'#5C93A6',observacoes:''};
    const cEs={id:uid(),criadoEm:new Date().toISOString(),nome:'Itaú — conta conjunta',banco:'itau',tipo:'corrente',titular:'Esposa',saldoInicial:4100,meta:null,cor:'#E4BC7E',observacoes:''};
    const cFi={id:uid(),criadoEm:new Date().toISOString(),nome:'Caixa — poupança da Filha',banco:'caixa',tipo:'poupanca',titular:'Filha',saldoInicial:600,meta:2000,cor:'#85C3AB',observacoes:'guardinho do primeiro emprego'};
    const kNu={id:uid(),criadoEm:new Date().toISOString(),nome:'Nubank roxo',bandeira:'mastercard',banco:'nubank',tipo:'credito',saldoInicial:0,diaFechamento:20,diaVencimento:5,limite:8000,titular:'Eu',cor:'#A9A3D8'};
    const kIt={id:uid(),criadoEm:new Date().toISOString(),nome:'Itaú Click',bandeira:'visa',banco:'itau',tipo:'credito',saldoInicial:0,diaFechamento:28,diaVencimento:10,limite:5000,titular:'Esposa',cor:'#7FA8C9'};
    const kAl={id:uid(),criadoEm:new Date().toISOString(),nome:'Alelo Alimentação',bandeira:'outro',banco:'outro',tipo:'alimentacao',saldoInicial:0,diaFechamento:20,diaVencimento:5,limite:null,titular:'Eu',cor:'#DB9BB4'};
    addLocal('contas',cEu);addLocal('contas',cEs);addLocal('contas',cFi);
    addLocal('cartoes',kNu);addLocal('cartoes',kIt);addLocal('cartoes',kAl);
    const L=[];let gi=0;const g=()=>uid();
    const add=(data,valor,tipo,contaId,cartaoId,categoriaId,descricao,titular,pago=true,obs='')=>L.push({id:uid(),criadoEm:new Date().toISOString(),data,valor:r2(valor),tipo,contaId:contaId||null,cartaoId:cartaoId||null,categoriaId:categoriaId||null,descricao,titular,pago,observacoes:obs,grupo:null});
    for(let m=-3;m<=2;m++){
      add(mk(m,5),5200,'receita',cEu.id,null,cat('Salário'),'Salário — minha',m<=0?'Eu':'Eu',m<=0);
      add(mk(m,10),3600,'receita',cEs.id,null,cat('Salário'),'Salário — da esposa',m<=0?'Esposa':'Esposa',m<=0);
      add(mk(m,10),1650,'despesa',cEs.id,null,cat('Moradia'),'Aluguel',m<=0?'Eu':'Eu',m<=0);
      add(mk(m,8),890,'despesa',cEs.id,null,cat('Educação'),'Escola da Filha',m<=0?'Esposa':'Esposa',m<=0);
      add(mk(m,15),120,'despesa',cEu.id,null,cat('Contas & Serviços'),'Internet + luz',m<=0?'Eu':'Eu',m<=0);
      add(mk(m,3),468,'despesa',cEu.id,null,cat('Mercado'),'Mercado — compra grande',m<=0?'Eu':'Eu',m<=0);
      add(mk(m,13),285,'despesa',cEu.id,null,cat('Mercado'),'Mercado — reposições',m<=0?'Esposa':'Esposa',m<=0);
      add(mk(m,23),312,'despesa',cEu.id,kNu.id,cat('Mercado'),'Mercado — no cartão',m<=0?'Eu':'Eu',m<=0);
      add(mk(m,6),118,'despesa',cEu.id,kNu.id,cat('Lazer'),'Restaurante em família',m<=0?'Eu':'Eu',m<=0);
      add(mk(m,17),95,'despesa',cEu.id,kNu.id,cat('Saúde'),'Farmácia',m<=0?'Esposa':'Esposa',m<=0);
      add(mk(m,19),89,'despesa',cEs.id,kIt.id,cat('Assinaturas'),'Streaming + música',m<=0?'Esposa':'Esposa',m<=0);
      add(mk(m,21),210,'despesa',cEs.id,kIt.id,cat('Transporte'),'Gasolina + aplicativos',m<=0?'Eu':'Eu',m<=0);
      add(mk(m,1),600,'carga_cartao',null,kAl.id,cat('Outras rendas'),'Carga mensal — alimentação','Eu',m<=0);
      add(mk(m,7),86,'despesa',null,kAl.id,cat('Alimentação'),'Padaria perto do trabalho','Eu',m<=0);
      add(mk(m,16),142,'despesa',null,kAl.id,cat('Alimentação'),'Almoço — restaurante','Eu',m<=0);
      add(mk(m,12),64,'despesa',cFi.id,null,cat('Lazer'),'Saída com as amigas',m<=0?'Filha':'Filha',m<=0);
    }
    const gPar=uid();
    for(let i=0;i<6;i++){const di=mk(-2+i,12);
      L.push({id:uid(),criadoEm:new Date().toISOString(),data:di,valor:400,tipo:'despesa',contaId:null,cartaoId:kNu.id,categoriaId:cat('Outros gastos'),descricao:`Celular novo — parcelado (${i+1}/6)`,titular:'Eu',pago:di<=todayISO(),observacoes:'compra parcelada',grupo:gPar});}
    add(mk(-1,5),1490,'pagamento_cartao',cEu.id,kNu.id,cat('Cartões'),'Pagamento fatura Nubank roxo','Eu');
    add(mk(0,10),299,'pagamento_cartao',cEs.id,kIt.id,cat('Cartões'),'Pagamento fatura Itaú Click','Esposa');
    add(mk(1,20),1200,'receita',cFi.id,null,cat('Salário'),'Primeiro salário da Filha 🎉','Filha',false);
    add(mk(1,22),300,'despesa',cFi.id,null,cat('Outros gastos'),'Depósito na poupança','Filha',false);
    add(mk(2,12),680,'despesa',cEu.id,kNu.id,cat('Viagem'),'Pousada — fim de semana','Eu',false);
    L.forEach(l=>addLocal('lancamentos',l));
    persistLocal();
    racoesDemo();
    persistLocal();
    toast('✨ Exemplos criados! Explore o Resumo, a Projeção (+30 dias) e os Relatórios.','ok',5000);
    goAba('resumo');});
}

/* ---- boot ---- */
function init(){
  loadLocal();
  if(!S.categorias.length&&!SB.cfg())seedCategorias();
  renderBrand();
  $$('.snav').forEach(b=>b.onclick=()=>goAba(b.dataset.aba));
  $$('.ptab[data-frente]').forEach(b=>b.onclick=()=>goFrente(b.dataset.frente));
  $('#btnConfig').onclick=formConfig;
  $('#dbPill').onclick=formConfig;
  render();
  if(SB.cfg()){toast('Conectando ao Supabase…');
    pullRemoto().then(()=>{if(!S.categorias.length)seedCategorias();render();})
      .catch(e=>{toast('⚠️ Supabase inacessível: '+e.message+' — usando dados locais','warn',5000);render();});}
}
init();

</script>
